<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפת קורסים - מתמטיקה ומדעי המחשב (TAU)</title>
<style>
:root{
  --c-hova:#4B5563; --c-leva:#2563EB; --c-bhira:#16A34A;
  --c-seminar:#9333EA; --c-sadna:#EA580C; --c-ruach:#CA8A04;
  --bg:#f3f4f6; --card:#fff; --ink:#111827;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;font-family:Arial,Heebo,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{background:#111827;color:#fff;padding:10px 16px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none;border-bottom:2px solid #6b7280}
header h1{margin:0;font-size:18px}
.copyright{font-size:11px;color:#9ca3af;white-space:nowrap}
header p{margin:2px 0 0;font-size:12px;color:#d1d5db}
#controls{background:var(--card);border-bottom:1px solid #e5e7eb;padding:10px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:stretch;position:sticky;top:0;z-index:19;flex:none}
.grp{border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px;background:#fafafa;display:flex;flex-direction:column;justify-content:flex-start}
.grp h3{margin:0 0 6px;font-size:13px;height:26px;line-height:20px;display:flex;align-items:center;position:relative;top:-2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
#types{display:grid;grid-template-columns:repeat(3,auto);gap:6px;justify-content:start}
#progs{display:grid;grid-template-columns:repeat(2,auto);gap:6px;justify-content:start;align-content:start}
#types .chip{white-space:nowrap;justify-self:start}
.chip{border:2px solid #ccc;border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;background:#fff;user-select:none;height:30px;display:inline-flex;align-items:center;box-sizing:border-box}
.chip.off{opacity:.35}
.chip .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;vertical-align:middle}
#search{font-size:14px;padding:6px 10px;border:1px solid #ccc;border-radius:8px;width:100%;height:30px;box-sizing:border-box}
label.prog{display:flex;gap:6px;align-items:center;font-size:13px;background:#fff;border:1px solid #ddd;border-radius:8px;padding:4px 8px;cursor:pointer}
#stats{font-size:12px;color:#374151}
.statrow{display:flex;gap:8px;margin-top:6px}
.statbox{flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:1px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.statbox b{display:block;font-size:15px;line-height:1.15}
.statbox span{font-size:10px;color:#6b7280}
#wrap{display:flex;flex:1;min-height:0}
#canvasWrap{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;background:#fff}
#canvasWrap.dragging{cursor:grabbing}
#zoombar{position:absolute;top:10px;left:10px;z-index:30;display:flex;gap:6px;background:rgba(255,255,255,.9);border:1px solid #ddd;border-radius:10px;padding:5px 7px;align-items:center}
#zoombar button{font-size:15px;width:30px;height:28px;border-radius:7px;border:1px solid #999;background:#fff;cursor:pointer}
#zoomlvl{font-size:12px;min-width:44px;text-align:center;direction:ltr}
#stage{position:relative;transform-origin:0 0}
.band{position:absolute;right:0;left:0;border-top:3px solid #9ca3af;background:rgba(255,255,255,.55)}
.band h2{position:sticky;right:8px;margin:4px 8px;font-size:15px;color:#111827;background:#fff;display:inline-block;padding:2px 10px;border-radius:8px;border:1px solid #ddd}
.subband{position:absolute;color:#4b5563;font-size:12px;background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:1px 8px;z-index:2}
.node{position:absolute;width:178px;min-height:50px;border-radius:10px;color:#fff;padding:4px 6px;font-size:12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);border:2px solid transparent;line-height:1.25;display:flex;flex-direction:column}
body.roomy .node{padding:6px 8px}
.node .cid{font-weight:bold;font-size:12px;direction:rtl;text-align:center;background:rgba(255,255,255,.25);border-radius:6px;padding:0 6px;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;gap:6px}
body.roomy .node .cid{padding:1px 6px;margin-bottom:3px}
.node .nm{text-align:center;flex:1;display:flex;align-items:center;justify-content:center;min-height:30px}
.node .nm .clamp{display:block;width:100%;line-clamp:2;-webkit-line-clamp:2;max-height:2.6em;overflow:hidden}
.node .meta{text-align:center;font-size:10px;opacity:.9;margin-top:2px}
body.roomy .node{min-height:74px}
body.roomy .node .cid{display:block;text-align:center}
.node.sel{border-color:#000;outline:3px solid #facc15}
.node.hl-pre{outline:4px solid #facc15;outline-offset:2px}
.node.hl-co{outline:4px dashed #22d3ee;outline-offset:2px}
.node.dim{opacity:.18}
#detail a{color:#1d4ed8;text-decoration:none}
#detail a b{text-decoration:underline}
.extcourse b{color:#b91c1c}
.progbtn{font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid #999;background:#fff;cursor:pointer;height:30px;display:inline-flex;align-items:center;box-sizing:border-box}
.progbtn.on{background:#111827;color:#fff}
svg#edges{position:absolute;top:0;right:0;overflow:visible;pointer-events:none}
#edges path{pointer-events:stroke;cursor:pointer}
#side{width:320px;background:#fff;border-left:2px solid #9ca3af;padding:12px;overflow:auto}
#side h2{font-size:15px;margin:0 0 6px}
.kv{font-size:13px;margin:4px 0}
.badge{display:inline-block;font-size:11px;border-radius:6px;padding:1px 8px;color:#fff;margin:1px}
.reqkey{color:#111827;font-weight:bold;margin-top:8px}
.reqline{background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:4px 8px;margin:3px 0;line-height:1.6}
.reqop{color:#6b7280;margin:0 6px;font-weight:bold}
.reqor{text-align:center;color:#1e40af;font-weight:bold;margin:2px 0}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;flex-wrap:wrap}
.sw{width:44px;height:0;border-top:3px solid #333;display:inline-block;vertical-align:middle;margin-left:6px}
.sw.dash{border-top-style:dashed}
.catbtn{border-radius:10px;border:1px solid #999;background:#111827;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;align-self:center;width:104px;height:104px;flex:none}
.catbtn svg{width:65%;height:65%}
body.dark .catbtn{background:#e5e7eb;color:#111827;border-color:#e5e7eb}
.catcard{background:#fff;border-radius:14px;padding:16px;max-width:92vw;text-align:center;color:#111827}
.spinner{width:36px;height:36px;border:4px solid #e5e7eb;border-top-color:#6b7280;border-radius:50%;margin:20px auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.dark .spinner{border-color:#374151;border-top-color:#9ca3af}
.iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid #999;background:#fff;color:#111827;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
body.dark .iconbtn{background:#374151;color:#fff;border-color:#6b7280}
body.dark .catcard{background:#1f2937;color:#e5e7eb}
.switch{position:relative;display:inline-block;width:34px;height:18px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;cursor:pointer;background:#cbd5e1;border-radius:18px;transition:.15s}
.switch .slider:before{position:absolute;content:"";height:12px;width:12px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked + .slider{background:#111827}
.switch input:checked + .slider:before{transform:translateX(-16px)}
body.dark .switch .slider{background:#4b5563}
body.dark .switch input:checked + .slider{background:#e5e7eb}
body.dark .switch input:checked + .slider:before{background:#111827}
.legtog .sw{width:26px}
.legtog{cursor:pointer;user-select:none;border:2px solid #ccc;border-radius:20px;padding:3px 10px;background:#fff;font-size:12px;height:30px;display:inline-flex;align-items:center;box-sizing:border-box}
.legtog.off{opacity:.4;text-decoration:line-through}
.btn{font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid #999;background:#fff;cursor:pointer}
.btn.on{background:#111827;color:#fff}
#yearBtns .btn{height:22px;font-size:12px;padding:2px 10px;display:inline-flex;align-items:center}
small.hint{color:#6b7280}
body.dark{background:#0f1727;color:#e5e7eb}
body.dark #controls{background:#111827;border-color:#374151}
body.dark .grp{background:#1f2937;border-color:#374151;color:#e5e7eb}
body.dark .btn,body.dark .progbtn,body.dark .chip,body.dark .legtog{background:#1f2937;border-color:#6b7280;color:#e5e7eb}
body.dark .btn.on,body.dark .progbtn.on{background:#f9fafb;color:#111827;border-color:#f9fafb}
body.dark #search{background:#1f2937;color:#fff;border-color:#6b7280}
body.dark #side{background:#111827;border-color:#4b5563}
body.dark #canvasWrap{background:#0f1727}
body.dark .band{background:rgba(148,163,184,.07);border-color:#4b5563}
body.dark .band h2,body.dark .subband{background:#1f2937;color:#e5e7eb;border-color:#4b5563}
body.dark .statbox{background:#1f2937;border-color:#4b5563}
body.dark #stats{color:#d1d5db}
body.dark #detail a{color:#93c5fd}
body.dark .reqkey{color:#e5e7eb}
body.dark .reqline{background:#1f2937;border-color:#374151}
body.dark .reqor{color:#93c5fd}
body.dark .extcourse b{color:#f87171}
body.dark .cidnum{color:#9ca3af}
body.dark small.hint{color:#9ca3af}
body.dark #zoombar{background:rgba(17,24,39,.92);border-color:#4b5563}
body.dark #zoombar button{background:#1f2937;color:#e5e7eb;border-color:#6b7280}
body.dark #zoomlvl{color:#e5e7eb}
.cidnum{color:#4b5563}
</style>
</head>
<body>
<header>
<h1>מפת דרכים - קורסי מתמטיקה ומדעי המחשב</h1>
<span class="copyright">© 2026 עומר למל. כל הזכויות שמורות.</span>
</header>
<div id="controls">
  <div class="grp"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;height:26px"><h3 style="margin:0">תכנית</h3><div style="font-size:12px;white-space:nowrap"><span id="yearBtns"></span></div></div><div class="chips" id="progs" style="margin-top:6px"></div>
  </div>
  <div class="grp"><h3>סוג קורס - לחצו להצגה/הסתרה</h3><div class="chips" id="types"></div></div>
  <div class="grp"><h3>חיפוש (שם או מספר, למשל 2160 / 0368-2160)</h3>
    <span style="position:relative;display:block">
      <input id="search" placeholder="חיפוש קורס..." style="padding-left:26px">
      <button id="clearSearch" title="נקה חיפוש" style="position:absolute;left:6px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:16px;line-height:1;cursor:pointer;color:#6b7280;display:none">×</button>
    </span>
    <div style="margin-top:6px;justify-content:space-between" class="legend"><span id="legPre" class="legtog" title="לחצו להצגה/הסתרה של דרישות הקדם"><span class="sw" style="border-color:#d97706"></span>דרישות קדם</span><span id="legCo" class="legtog" title="לחצו להצגה/הסתרה של דרישות המקביל"><span class="sw dash" style="border-color:#0891b2"></span>דרישות מקבילות</span></div>
  </div>
  <div class="grp"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">תצוגה</h3><label class="switch" title="מצב כהה"><input type="checkbox" id="darkTog"><span class="slider"></span></label></div><div style="margin-top:6px"><button class="progbtn" id="mRoom">מרווח</button> <button class="progbtn on" id="mCmp">דחוס</button></div><div id="stats"></div></div>
  <button id="catBtn" class="catbtn" title="חתול אקראי"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="15.5" rx="4.6" ry="3.8"/><circle cx="5.6" cy="10" r="2"/><circle cx="9.4" cy="6.6" r="2.1"/><circle cx="14.6" cy="6.6" r="2.1"/><circle cx="18.4" cy="10" r="2"/></svg></button>
</div>
<div id="catModal" style="display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);align-items:center;justify-content:center">
  <div class="catcard">
    <div style="display:flex;align-items:center;margin-bottom:8px"><div style="font-weight:bold;flex:1;text-align:center">הפסקת חתול!</div><button class="iconbtn" id="catMute" title="השתק"></button></div>
    <img id="catImg" style="display:none;max-width:70vw;max-height:60vh;border-radius:10px" alt="חתול אקראי">
    <div id="catSpin" class="spinner" style="display:none"></div>
    <div id="catErr" style="display:none;color:#b91c1c">אין חתול זמין (בדקו חיבור לאינטרנט)</div>
    <div style="margin-top:10px;display:flex;gap:8px;justify-content:center">
      <button class="progbtn" id="catMore">חתול נוסף</button>
      <button class="progbtn" id="catClose">סגור</button>
    </div>
  </div>
</div>
<div id="wrap">
  <div id="side"><h2>פרטי קורס</h2><div id="detail"><small class="hint">לחצו על קורס במפה.</small></div></div>
  <div id="canvasWrap">
    <div id="zoombar"><button id="zin" title="התקרב">+</button><span id="zoomlvl">100%</span><button id="zout" title="התרחק">−</button><button id="zreset" title="איפוס תצוגה" style="width:auto;padding:0 8px;font-size:12px">איפוס</button></div>
    <div id="stage"><svg id="edges"></svg><div id="nodes"></div></div></div>
</div>
<script>
const COLORS={'חובה':'var(--c-hova)','ליבה':'var(--c-leva)','בחירה':'var(--c-bhira)','סמינר':'var(--c-seminar)','סדנה':'var(--c-sadna)','שאר רוח':'var(--c-ruach)'};
const PROGN={};
let DATA, selProg='dual', year='2026', offTypes=new Set(['שאר רוח','סדנה','סמינר']), query='', selected=null, showPreE=true, showCoE=true;
try{
  const s=JSON.parse(localStorage.getItem('tauFilters')||'{}');
  if(Array.isArray(s.off))offTypes=new Set(s.off);
  if(typeof s.pre==='boolean')showPreE=s.pre;
  if(typeof s.co==='boolean')showCoE=s.co;
  if(typeof s.prog==='string')selProg=s.prog;
  if(typeof s.year==='string')year=s.year;
}catch(_){}
function saveFilters(){try{localStorage.setItem('tauFilters',JSON.stringify({off:[...offTypes],pre:showPreE,co:showCoE,prog:selProg,year}));}catch(_){}}
let byId={};
let hlPre=new Set(), hlCo=new Set();
let zoom=1,panX=0,panY=0,lastW=0,lastH=0,lastPos={};
const PAN_MARGIN=150;
function clampPan(){ // keep at least PAN_MARGIN px of the graph visible (stage is right-aligned in RTL, top-aligned)
  if(!lastW||!lastH)return;
  const wrap=document.getElementById('canvasWrap');
  const Ww=wrap.clientWidth,Wh=wrap.clientHeight;
  const L0x=Ww-lastW,L0y=0,sw=lastW*zoom,sh=lastH*zoom;
  panX=Math.min((Ww-PAN_MARGIN)-L0x,Math.max(PAN_MARGIN-L0x-sw,panX));
  panY=Math.min((Wh-PAN_MARGIN)-L0y,Math.max(PAN_MARGIN-L0y-sh,panY));}
function applyView(){clampPan();
  document.getElementById('stage').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  const zl=document.getElementById('zoomlvl');if(zl)zl.textContent=Math.round(zoom*100)+'%';}
function zoomAt(mx,my,f){const wrap=document.getElementById('canvasWrap');
  if(!lastW)return;
  const nz=Math.min(3,Math.max(0.3,zoom*f));
  // exact anchor math from state only (never read mid-animation rects):
  // stage layout offset is constant: right-aligned in RTL, top-aligned
  const L0x=wrap.clientWidth-lastW,L0y=0;
  const wx=(mx-L0x-panX)/zoom,wy=(my-L0y-panY)/zoom; // world point under cursor
  zoom=nz;panX=mx-L0x-wx*nz;panY=my-L0y-wy*nz;applyView();}
function centerOn(id){ // glide the node into view, but only if it's off-screen
  const p=lastPos&&lastPos[id];if(!p||!lastW)return;
  const wrap=document.getElementById('canvasWrap');
  const Ww=wrap.clientWidth,Wh=wrap.clientHeight,L0x=Ww-lastW;
  const cy=(p.top+p.bottom)/2;
  const sx=L0x+p.cx*zoom+panX,syy=cy*zoom+panY;
  const M=60;
  if(sx>M&&sx<Ww-M&&syy>M&&syy<Wh-M)return;
  document.getElementById('stage').style.transition='transform .25s ease-out';
  panX=Ww/2-L0x-p.cx*zoom;panY=Wh/2-cy*zoom;applyView();}
const BANDS=[{y:1,t:'שנה א׳'},{y:2,t:'שנה ב׳'},{y:3,t:'שנה ג׳ (כולל שנים ב׳+ג׳)'},{y:4,t:'שאר רוח / אחר'}];
// per-mode layout config: compact squeezes chrome, roomy spends space visibly
const DCFG={
  compact:{NW:178,NH:56,GY:22,GX:26,PAD:60,TOPH:38,SUBH:26,BANDPAD:16,SEC:10,MAXL:10,nameFs:12},
  roomy:{NW:196,NH:86,GY:38,GX:30,PAD:60,TOPH:46,SUBH:28,BANDPAD:24,SEC:12,MAXL:8,nameFs:13}};
const fitCache={};
let nodeMode='compact';
try{nodeMode=localStorage.getItem('tauNodeMode')||'roomy';}catch(_){}
let darkMode=false;
try{darkMode=localStorage.getItem('tauDark')==='1';}catch(_){}
function applyDark(){document.body.classList.toggle('dark',darkMode);
  const b=document.getElementById('darkTog');if(b)b.checked=darkMode;}

fetch('data.json').then(r=>r.json()).then(d=>{DATA=d;byId={};d.courses.forEach(c=>byId[c.id]=c);
  const dys=[...new Set(d.courses.flatMap(c=>Object.keys(c.programs[selProg]||{})))].sort();
  if(dys.length)year=dys[dys.length-1]; // default to latest curriculum
  buildControls();render();});

function occOf(c){ // occurrence for current year+program selection (single program)
  return (c.programs[selProg]||{})[year]||null;
}
function mainType(c){const o=occOf(c);return o?o.type:'בחירה';}
function mainYear(c){const o=occOf(c);if(!o)return 4;return o.year===0?3:o.year;}

function buildControls(){
  const pc=document.getElementById('progs');
  const syncP=()=>pc.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.p===selProg));
  DATA.programs.forEach(p=>{PROGN[p.id]=p.name;});
  if(!PROGN[selProg])selProg='dual'; // saved program may predate current data
  const PORDER=['dual','csai','cs','math']; // display order
  DATA.programs.slice().sort((a,b)=>{const ia=PORDER.indexOf(a.id),ib=PORDER.indexOf(b.id);
    return(ia<0?99:ia)-(ib<0?99:ib);}).forEach(p=>{const b=document.createElement('button');b.className='progbtn';b.dataset.p=p.id;b.textContent=p.name;
    b.onclick=()=>selectProg(p.id);pc.appendChild(b);});
  syncP();
  const yearsOf=p=>[...new Set(DATA.courses.flatMap(c=>Object.keys(c.programs[p]||{})))].sort(); // ascending: latest ends up leftmost
  const syncYears=()=>{const ys=yearsOf(selProg);if(!ys.includes(year))year=ys[ys.length-1];
    const yc=document.getElementById('yearBtns');yc.innerHTML='';
    yearsOf(selProg).forEach(y=>{const b=document.createElement('button');b.className='btn'+(y===year?' on':'');b.textContent=y;
      b.onclick=()=>{year=y;selected=null;syncYears();saveFilters();render();};yc.appendChild(b);});};
  const selectProg=p=>{selProg=p;selected=null;
    const ys=yearsOf(p);if(!ys.includes(year))year=ys[ys.length-1]; // ascending: last is latest
    syncP();syncYears();saveFilters();render();};
  syncYears();
  const tc=document.getElementById('types');
  Object.keys(COLORS).forEach(t=>{const s=document.createElement('span');s.className='chip'+(offTypes.has(t)?' off':'');s.dataset.t=t;
    s.innerHTML=`<span class="dot" style="background:${COLORS[t]}"></span>${t}`;s.onclick=()=>{offTypes.has(t)?offTypes.delete(t):offTypes.add(t);s.classList.toggle('off');saveFilters();render();};tc.appendChild(s);});
  const si=document.getElementById('search'),cs=document.getElementById('clearSearch');
  const syncClear=()=>{cs.style.display=si.value?'block':'none';};
  si.addEventListener('input',()=>{query=si.value.trim();syncClear();render();});
  cs.onclick=()=>{si.value='';query='';syncClear();si.focus();render();};
  const syncLeg=()=>{document.getElementById('legPre').classList.toggle('off',!showPreE);document.getElementById('legCo').classList.toggle('off',!showCoE);};
  const syncMode=()=>{document.getElementById('mCmp').classList.toggle('on',nodeMode==='compact');document.getElementById('mRoom').classList.toggle('on',nodeMode==='roomy');};
  const setMode=m=>{nodeMode=m;try{localStorage.setItem('tauNodeMode',m);}catch(_){}syncMode();render();};
  document.getElementById('mCmp').onclick=()=>setMode('compact');
  document.getElementById('mRoom').onclick=()=>setMode('roomy');
  syncMode();

    const r=wrap.getBoundingClientRect();zoomAt(r.width/2,r.height/2,f);};

  document.getElementById('zreset').onclick=()=>{document.getElementById('stage').style.transition='transform .15s ease-out';zoom=1;panX=0;panY=0;applyView();};
}
function matchQ(c){if(!query)return true;const q=query.replace('-','');return c.name.includes(query)||c.id.replace('-','').includes(q);}
function meow(){try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const ctx=meow.ctx||(meow.ctx=new AC());
  if(ctx.state==='suspended')ctx.resume();
  const t=ctx.currentTime,osc=ctx.createOscillator(),g=ctx.createGain();
  const lfo=ctx.createOscillator(),lg=ctx.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(420,t);
  osc.frequency.linearRampToValueAtTime(880,t+0.18);
  osc.frequency.linearRampToValueAtTime(520,t+0.45);
  lfo.type='sine';lfo.frequency.value=28;lg.gain.value=25;
  lfo.connect(lg);lg.connect(osc.frequency);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.25,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
  osc.connect(g);g.connect(ctx.destination);
  osc.start(t);lfo.start(t);osc.stop(t+0.55);lfo.stop(t+0.55);
}catch(_){}}

function fitClamps(){ // shrink overflowing names to fit the 2-line box (cached per course+mode)
  const key=nodeMode+':';
  document.querySelectorAll('#nodes .node').forEach(nd=>{
    const sp=nd.querySelector('.clamp');if(!sp||!nd.dataset.cid)return;
    const ck=key+nd.dataset.cid,hit=fitCache[ck];
    if(hit!==undefined){if(hit)sp.style.fontSize=hit;return;}
    sp.style.fontSize='';
    const base=parseFloat(getComputedStyle(sp).fontSize)||12;
    let fs=base,guard=0;
    while(sp.scrollHeight>sp.clientHeight+1&&fs>8&&guard<12){fs-=0.5;sp.style.fontSize=fs+'px';guard++;}
    fitCache[ck]=fs<base?fs+'px':'';
  });
}
function render(){

    const list=courses.filter(c=>inBand(c,b.y)&&semRank(semOf(c))===s)
      .sort((a,c2)=>depth[a.id]-depth[c2.id]||(a.id<c2.id?-1:1));
    if(!list.length)continue;
    const rows=[],rowOf={};
    const depthSort=(a,b)=>depth[a.id]-depth[b.id]||(a.id<b.id?-1:1);

  const nodesEl=document.getElementById('nodes');nodesEl.innerHTML='';

  const markers=`<defs>

    <marker id="ahP" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5.5 L0,11 z" fill="#d97706"/></marker>
    <marker id="ahC" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5.5 L0,11 z" fill="#0891b2"/></marker></defs>`;

        else{const dx1=spread(outE[e.from],e,70),dx2=spread(inE[e.to],e,70);

      return `<path data-e="1" data-w="${w}" data-o="${o}" d="${d}" fill="none" stroke="${stroke}" stroke-width="${w}" opacity="${o}" ${dash} ${hide} marker-end="url(#${mk})"><title>${nameOf(e.from)} → ${nameOf(e.to)} (${kind})</title></path>`;}).join('');
}
function nameOf(id){if(byId[id])return byId[id].name||mainType(byId[id]);if(DATA.extNames&&DATA.extNames[id])return DATA.extNames[id];return id;}
function courseLink(id){const nm=nameOf(id);
  if(byId[id])return `<a href="#" data-go="${id}"><b>${nm}</b> <span dir="ltr" class="cidnum">(${id})</span></a>`;
  return `<span class="extcourse" title="קורס זה אינו מופיע במפה"><b>${nm}</b> <span dir="ltr">(${id})</span></span>`;}
function renderLogic(groups){
  if(!groups||!groups.length)return'—';
  return groups.map(g=>`<div class="reqline">${g.map(courseLink).join('<span class="reqop">וגם</span>')}</div>`).join('<div class="reqor">או</div>');
}
function linkList(ids){if(!ids.length)return'—';return ids.map(id=>`<a href="#" data-go="${id}">${nameOf(id)}</a>`).join(' · ');}
function showDetail(c){
  const o=occOf(c);
  const ramaShort=o?o.rama.replace(/\s*-\s*(קורסי\s)?(חובה|בחירה|ליבה|סמינר|סדנה).*$/,'').trim(): '';
  const occ=o?`<div>${ramaShort}${(!/סמסטר/.test(ramaShort)&&o.sem)?' · סמסטר '+o.sem:''}</div>`:'';
  const next=DATA.edges.filter(e=>e.from===c.id);
  const links=(DATA.programs||[]).filter(p=>c.programs[p.id]).map(p=>{
    const nm=p.id==='dual'?'ידיעון דו-חוגי':('ידיעון '+p.name);
    return Object.keys(c.programs[p.id]).sort().map(y=>{
      const url=p['url'+y];
      return url?`<div class="kv"><a target="_blank" href="${url}">${nm} ${y}</a></div>`:'';}).join('');}).join('');
  document.getElementById('detail').innerHTML=`<h2>${c.name||mainType(c)}</h2>
    <div class="kv"><b style="direction:ltr">${c.id}</b> · ${c.credits} ש״ס · <span class="badge" style="background:${COLORS[mainType(c)]}">${mainType(c)}</span></div>${occ}
    <div class="kv"><div class="reqkey">דרישות קדם:</div>${renderLogic(c.reqPre)}</div>
    <div class="kv"><div class="reqkey">דרישות מקבילות:</div>${renderLogic(c.reqCo)}</div>
    <div class="kv"><b>קורסים שאפשר לקחת אחריו:</b><br>${next.length?next.map(e=>`${courseLink(e.to)} (${e.kind==='co'?'מקביל':'קדם'})`).join(' · '):'—'}</div>
    <div class="kv"><small class="hint">הערה: לימוד הקורס בעבר וזכאות לגשת לבחינה מאפשרים רישום לקורס.</small></div>${links}`;
  document.querySelectorAll('#detail a[data-go]').forEach(a=>a.onclick=ev=>{ev.preventDefault();const t=DATA.courses.find(x=>x.id===a.dataset.go);if(t){selected=t.id;showDetail(t);render();centerOn(t.id);}});
}
function syncCatSize(){try{
  const btn=document.getElementById('catBtn');if(!btn)return;
  const hs=[...document.querySelectorAll('#controls .grp')].map(g=>g.getBoundingClientRect().height);
  if(!hs.length)return;
  const h=Math.max(44,Math.round(Math.max(...hs)));
  btn.style.width=h+'px';btn.style.height=h+'px';
}catch(_){}}
window.addEventListener('resize',()=>{render();syncCatSize();});
</script>
</body>
</html>
